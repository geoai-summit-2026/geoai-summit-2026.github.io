<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geo-AI Summit · 메일 본문 준비</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#080b13;color:#edf2fb;font-family:"Malgun Gothic","Apple SD Gothic Neo",Arial,sans-serif;line-height:1.6}main{max-width:1000px;margin:0 auto;padding:32px 20px 48px}h1{margin:0 0 10px;font-size:28px;line-height:1.3}p{margin:0 0 14px;color:#c0cbdd;font-size:15px}.actions{margin:24px 0 12px}button,a.help{display:inline-block;margin:0 8px 10px 0;padding:11px 16px;border:1px solid #52617b;border-radius:6px;background:#101827;color:#f6f8fc;font:inherit;font-size:14px;font-weight:700;line-height:22px;cursor:pointer;text-decoration:none}button.primary{background:#10dafc;border-color:#10dafc;color:#001b21}button:disabled{opacity:.45;cursor:wait}button:focus-visible,a:focus-visible{outline:3px solid #b69bff;outline-offset:3px}#status{min-height:24px;color:#94e8f6;font-size:14px;margin-bottom:18px}.preview{max-width:600px;margin:0 auto;background:#000;border:1px solid #303c50}iframe{display:block;width:100%;height:1500px;border:0;background:#000}#manualCopy{max-width:600px;margin:18px auto;background:#000;border:2px solid #10dafc}#manualCopy[hidden]{display:none}.note{font-size:13px;line-height:21px;max-width:76ch}::selection{background:#b69bff;color:#080b13}@media(max-width:500px){main{padding:24px 12px}h1{font-size:23px}button,a.help{width:100%;margin-right:0}iframe{height:1800px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style></head><body><main>
<h1>메일 본문으로 보내기</h1>
<p>미리보기를 확인한 뒤 <strong>메일 본문 복사</strong>를 누르고, 네이버 메일 쓰기의 본문에 붙여넣으세요.</p>
<p class="note">네이버 메일에 HTML 입력 모드가 보이면 <strong>HTML 소스 복사</strong>도 사용할 수 있습니다. 메일 발송 전 내 주소로 테스트해 버튼과 이미지가 보이는지 확인하세요.</p>
<div class="actions"><button class="primary" id="copyBody" disabled>메일 본문 복사</button><button id="copySource" disabled>HTML 소스 복사</button><button id="downloadBody" disabled>HTML 파일 다운로드</button><button id="showManual" disabled>직접 복사할 본문 펼치기</button><a class="help" href="https://geoai-summit-2026.github.io/" target="_blank" rel="noopener noreferrer">자료실 열기</a></div>
<p id="status" role="status" aria-live="polite">메일 본문을 불러오고 있어요.</p>
<div id="manualCopy" hidden tabindex="-1" aria-label="직접 복사할 메일 본문"></div>
<div class="preview"><iframe id="preview" title="Geo-AI Summit 메일 본문 미리보기" sandbox="allow-popups allow-popups-to-escape-sandbox allow-downloads"></iframe></div>
<p class="note" style="margin-top:20px;">이 화면은 본문 준비용입니다. 메일은 자동으로 발송되지 않습니다. 이미지 표시 방식은 받는 사람의 메일 설정에 따라 다를 수 있습니다.</p>
</main><script>
'use strict';
let emailHTML='';let plainText='';
const status=document.getElementById('status');
function showManual(){const target=document.getElementById('manualCopy');target.innerHTML=emailHTML;target.hidden=false;target.focus();const selection=window.getSelection();const range=document.createRange();range.selectNodeContents(target);selection.removeAllRanges();selection.addRange(range);status.textContent='펼쳐진 본문이 선택됐어요. Ctrl+C를 누른 뒤 네이버 메일 본문에 붙여넣으세요.';target.scrollIntoView({block:'start',behavior:'auto'});}
document.getElementById('copyBody').addEventListener('click',async()=>{try{if(!navigator.clipboard||!window.ClipboardItem)throw new Error('unsupported');await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([emailHTML],{type:'text/html'}),'text/plain':new Blob([plainText],{type:'text/plain'})})]);status.textContent='메일 본문을 복사했어요. 네이버 메일 쓰기의 본문에 Ctrl+V로 붙여넣으세요.';}catch{showManual();}});
document.getElementById('copySource').addEventListener('click',async()=>{try{if(!navigator.clipboard)throw new Error('unsupported');await navigator.clipboard.writeText(emailHTML);status.textContent='HTML 소스를 복사했어요. 메일의 HTML 입력 모드에 붙여넣으세요.';}catch{const source=document.createElement('textarea');source.value=emailHTML;source.setAttribute('aria-label','메일 본문 HTML 소스');source.style.cssText='display:block;width:100%;min-height:200px;margin:16px 0;font:13px monospace;background:#101827;color:#edf2fb;border:1px solid #10dafc;';document.getElementById('status').after(source);source.focus();source.select();status.textContent='아래 소스가 선택됐어요. Ctrl+C를 눌러 복사하세요.';}});
document.getElementById('showManual').addEventListener('click',showManual);
document.getElementById('downloadBody').addEventListener('click',()=>{const standalone='<!doctype html>\n<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geo-AI Summit 2026 메일 본문</title></head><body style="margin:0;background:#000000;">'+emailHTML+'</body></html>';const url=URL.createObjectURL(new Blob([standalone],{type:'text/html;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='GeoAI_Summit_2026_메일본문.html';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);});
fetch('./email.html',{cache:'no-store'}).then(response=>{if(!response.ok)throw new Error('load');return response.text();}).then(html=>{emailHTML=html;const parsed=new DOMParser().parseFromString(html,'text/html');plainText=parsed.body.textContent.trim()+'\n\n'+Array.from(parsed.querySelectorAll('a[href]')).map(a=>a.textContent.trim()+': '+a.getAttribute('href')).join('\n');document.getElementById('preview').srcdoc='<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0;background:#000000;">'+html+'</body></html>';document.querySelectorAll('button').forEach(button=>button.disabled=false);status.textContent='메일 본문을 준비했어요. 복사 후 네이버 메일에 붙여넣으세요.';}).catch(()=>{status.textContent='메일 본문을 불러오지 못했어요. 인터넷 연결을 확인하고 이 화면을 새로고침하세요.';});
</script></body></html>
